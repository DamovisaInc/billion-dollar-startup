name: DevOps my shit

on: workflow_dispatch
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: build app
      run: |
        sleep 12;
        if (( RANDOM % 2 )); then echo "::error file=app.js,line=101,col=9,endColumn=10,title=APP_FAILURE::Missing semicolon or something who knows"; fi
  
    - name: run tests
      run: |
        sleep 11;
        if (( RANDOM % 2 )); then echo "::error file=test_everything.js,line=126,col=5,endColumn=17,title=TEST_ERROR::Tests failed"; fi

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: deploy to Azure
      run: |
        sleep 9;
        echo "::error file=deploy.yml,line=10,col=2,endColumn=30,title=DEPLOY_FAILURE::Unable to deploy to azure";
